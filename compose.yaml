services:
  db:
    image: postgres:16
    env_file: .env
    # No published port on purpose: the database holds personal data and only the backend
    # (over the Compose network) needs it. For a SQL shell: docker compose exec db psql ...
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Inside the Compose network the database is reached by its service name, "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RESUME_STORAGE_DIR: /data/resumes
    volumes:
      # Uploaded resume files: a private named volume, not part of the repository.
      - resume_files:/data/resumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  resume_files:
